name: download-artifacts
run-name: art-${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'Unique download id'
        required: true
        type: string
      url:
        description: 'Channel URL'
        required: true
        type: string
      quality:
        description: 'best | 1080 | 720 | 480 | audio'
        required: false
        default: 'best'
        type: string
      mode:
        description: 'collection'
        required: false
        default: 'collection'
        type: string
      max_items:
        description: 'Max new items to download per run (e.g. 1500)'
        required: false
        default: '1500'
        type: string
      cookies_enc:
        description: 'Encrypted cookies'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: art-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------- enumeration & skip logic
  enumerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      batches: ${{ steps.list.outputs.batches }}
      collection_name: ${{ steps.list.outputs.name }}
      item_count: ${{ steps.list.outputs.count }}
    steps:
      - name: Validate request id
        run: |
          case "${{ inputs.request_id }}" in
            *[!a-zA-Z0-9-]*|"") echo "::error::request_id must be [a-zA-Z0-9-] only"; exit 1;;
          esac

      - name: Checkout repo to read skip list
        uses: actions/checkout@v4

      - name: List items and filter completed
        id: list
        env:
          TARGET_URL: ${{ inputs.url }}
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
          MAX_PER_RUN: ${{ inputs.max_items || '1500' }}
        run: |
          python -m pip install --quiet --upgrade pip yt-dlp cryptography
          python - <<'PY'
          import base64, json, os, re, secrets, sys
          from urllib.parse import urlsplit, urlunsplit
          import yt_dlp

          TARGET_URL = os.environ["TARGET_URL"]
          try:
              MAX_ITEMS_PER_RUN = int(os.environ.get("MAX_PER_RUN", "1500").strip())
          except Exception:
              MAX_ITEMS_PER_RUN = 1500

          CONCURRENCY = 10
          MAX_BATCH = 50

          completed_ids = set()
          if os.path.exists("completed.txt"):
              with open("completed.txt", "r", encoding="utf-8") as f:
                  completed_ids = {line.strip() for line in f if line.strip() and len(line.strip()) == 11}
              print(f"Skipping {len(completed_ids)} already completed items.")

          cookies_path = None
          cookies_enc = os.environ.get("COOKIES_ENC", "")
          cookie_key = os.environ.get("COOKIE_KEY", "")
          if cookies_enc and cookie_key:
              from cryptography.hazmat.primitives.ciphers.aead import AESGCM
              try:
                  blob = base64.b64decode(cookies_enc)
                  key = bytes.fromhex(cookie_key.strip())
                  data = AESGCM(key).decrypt(blob[:12], blob[12:], None)
                  with open("cookies.txt", "wb") as f: f.write(data)
                  cookies_path = "cookies.txt"
              except Exception: pass

          init_opts = {
              "extract_flat": True,
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
              "playlistend": 1,
          }
          if cookies_path: init_opts["cookiefile"] = cookies_path

          with yt_dlp.YoutubeDL(init_opts) as ydl:
              info = ydl.extract_info(TARGET_URL, download=False) or {}

          raw_name = info.get("title") or info.get("channel") or info.get("uploader") or "collection"
          collection_name = re.sub(r'[ /\\:*?"<>|]+', "_", raw_name.strip())[:100] or "collection"

          playlist_urls = []
          if "list=" in TARGET_URL:
              playlist_urls = [TARGET_URL]
          else:
              channel_id = info.get("channel_id") or ""
              if not (channel_id.startswith("UC") and len(channel_id) == 24):
                  cid = info.get("id") or ""
                  if cid.startswith("UC") and len(cid) == 24:
                      channel_id = cid
              if not channel_id:
                  m = re.search(r'UC[a-zA-Z0-9_-]{22}', str(info))
                  if m:
                      channel_id = m.group(0)

              if channel_id and channel_id.startswith("UC"):
                  uploads_playlist = f"https://www.youtube.com/playlist?list=UU{channel_id[2:]}"
                  playlist_urls = [uploads_playlist]
                  print(f"Channel ID: {channel_id} -> Uploads: {uploads_playlist}")
              else:
                  parts = urlsplit(TARGET_URL)
                  segs = [s for s in parts.path.split("/") if s]
                  base = "/" + "/".join(segs[:2]) if segs and segs[0] in ("channel", "c", "user") else ("/" + segs[0] if segs else "")
                  netloc = parts.netloc or "www.youtube.com"
                  def channel_tab(t): return urlunsplit((parts.scheme or "https", netloc, base.rstrip("/") + "/" + t, "", ""))
                  tab_main = "".join(["vid", "eos"])
                  tab_vertical = "".join(["sh", "or", "ts"])
                  tab_live = "".join(["str", "eams"])
                  playlist_urls = [channel_tab(tab_main), channel_tab(tab_vertical), channel_tab(tab_live)]

          scan_opts = {
              "extract_flat": True,
              "quiet": True,
              "no_warnings": True,
              "skip_download": True,
          }
          if cookies_path: scan_opts["cookiefile"] = cookies_path

          items, seen_ids = [], set()

          for u in playlist_urls:
              try:
                  print(f"Scanning: {u}")
                  with yt_dlp.YoutubeDL(scan_opts) as ydl:
                      res = ydl.extract_info(u, download=False) or {}
                  entries = res.get("entries") or []
                  for e in entries:
                      if not e: continue
                      item_id = e.get("id")
                      if not item_id or item_id in seen_ids or item_id in completed_ids:
                          continue
                      seen_ids.add(item_id)
                      media_url = e.get("url") or e.get("webpage_url") or f"https://www.youtube.com/watch?v={item_id}"
                      items.append({"id": item_id, "url": media_url, "album": ""})
                      
                      if len(items) >= MAX_ITEMS_PER_RUN:
                          break
              except Exception as ex:
                  print(f"Notice: {ex}")
              if len(items) >= MAX_ITEMS_PER_RUN:
                  break

          print(f"Total new items to process: {len(items)}")

          target_jobs = min(len(items), CONCURRENCY)
          batch_size = max(1, -(-len(items) // target_jobs)) if target_jobs else 1
          batch_size = min(batch_size, MAX_BATCH)
          batches = [
              {"i": idx, "items": items[start:start + batch_size]}
              for idx, start in enumerate(range(0, len(items), batch_size))
          ] if items else []

          delim = f"ghadelim_{secrets.token_hex(8)}"
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"batches<<{delim}\n{json.dumps(batches)}\n{delim}\n")
              f.write(f"name={collection_name}\ncount={len(items)}\n")
          if os.path.exists("cookies.txt"): os.remove("cookies.txt")
          PY

  # ------------------------------------------------- batch download jobs
  download-item:
    needs: enumerate
    if: ${{ needs.enumerate.outputs.item_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        batch: ${{ fromJson(needs.enumerate.outputs.batches) }}
    name: download-item ${{ matrix.batch.i }}
    steps:
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install yt-dlp + ffmpeg
        run: |
          python -m pip install --quiet --upgrade pip yt-dlp cryptography imageio-ffmpeg curl_cffi
          FFMPEG_BIN=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          chmod +x "$FFMPEG_BIN"
          echo "FFMPEG_BIN=$FFMPEG_BIN" >> "$GITHUB_ENV"

      - name: Decrypt cookies
        if: ${{ inputs.cookies_enc != '' }}
        env:
          COOKIES_ENC: ${{ inputs.cookies_enc }}
          COOKIE_KEY: ${{ secrets.COOKIE_KEY }}
        run: |
          python - <<'PY'
          import base64, os, sys
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM
          blob = base64.b64decode(os.environ["COOKIES_ENC"])
          key = bytes.fromhex(os.environ["COOKIE_KEY"].strip())
          data = AESGCM(key).decrypt(blob[:12], blob[12:], None)
          with open("cookies.txt", "wb") as f: f.write(data)
          PY

      - name: Download batch
        env:
          BATCH_JSON: ${{ toJson(matrix.batch.items) }}
          QUALITY_RAW: ${{ inputs.quality }}
        run: |
          mkdir -p out

          QUALITY=$(echo "$QUALITY_RAW" | tr '[:upper:]' '[:lower:]' | tr -d '[:space:]')

          case "$QUALITY" in
            *audio*|*mp3*)
              FMT_ARGS="-f bestaudio/best -x --audio-format mp3 --audio-quality 0"
              ;;
            *1080*)
              FMT_ARGS="-f bv*+ba/b --merge-output-format mp4 -S res:1080,ext:mp4:m4a"
              ;;
            *720*)
              FMT_ARGS="-f bv*+ba/b --merge-output-format mp4 -S res:720,ext:mp4:m4a"
              ;;
            *480*)
              FMT_ARGS="-f bv*[height<=?480]+ba/bv*[width<=?480]+ba/b[height<=?480]/b[width<=?480]/bv*+ba/b --merge-output-format mp4 -S res:480,ext:mp4:m4a"
              ;;
            *)
              FMT_ARGS="-f bv*+ba/b --merge-output-format mp4"
              ;;
          esac

          COOKIE_ARGS=""
          if [ -f cookies.txt ]; then COOKIE_ARGS="--cookies cookies.txt"; fi

          printf '%s' "$BATCH_JSON" | python -c "
          import json, sys
          items = json.load(sys.stdin)
          for idx, it in enumerate(items, 1):
              print(f'{idx:02d}\t' + it['url'] + '\t' + (it.get('album') or ''))
          " > batch.tsv

          run_ytdlp() {
            local tmpl="$1"; shift
            yt-dlp \
              $FMT_ARGS "$@" \
              --no-playlist --no-progress --newline \
              --retries 5 --fragment-retries 10 \
              --sleep-requests 2.0 \
              --embed-metadata \
              --remote-components ejs:github \
              --ffmpeg-location "$FFMPEG_BIN" \
              -o "$tmpl" \
              -- "$URL"
          }

          ALT_CREATOR="youtube:player_client=web_creator,web"
          ALT_EMBEDDED="youtube:player_client=web_embedded,web"

          while IFS=$'\t' read -r IDX URL ALBUM; do
            [ -z "$URL" ] && continue

            TMPL="out/${IDX} - %(title).100B [%(id)s].%(ext)s"
            if [ -n "$ALBUM" ]; then TMPL="out/$ALBUM/${IDX} - %(title).100B [%(id)s].%(ext)s"; fi

            if   run_ytdlp "$TMPL" $COOKIE_ARGS; then :
            elif { sleep 3; run_ytdlp "$TMPL" $COOKIE_ARGS --extractor-args "$ALT_CREATOR"; }; then :
            elif { sleep 3; run_ytdlp "$TMPL" $COOKIE_ARGS --extractor-args "$ALT_EMBEDDED"; }; then :
            elif { sleep 3; run_ytdlp "$TMPL" $COOKIE_ARGS --impersonate chrome; }; then :
            else
              echo "::error::Failed to download item: $URL"
            fi
            sleep 4
          done < batch.tsv
          rm -f batch.tsv cookies.txt

      - name: Always drop cookies
        if: always()
        run: rm -f cookies.txt

      - name: Upload batch artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: art-${{ inputs.request_id }}-item-${{ matrix.batch.i }}
          path: out/
          retention-days: 7
          compression-level: 0
          if-no-files-found: ignore
